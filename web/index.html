<!doctype html>
<html lang="gl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>As Resetas do Pardelo</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='18 18 72 72'><circle cx='54' cy='54' r='36' fill='%23c2562f'/><path fill='white' d='M40,34h2.4v13h1.8v-13h2.4v13h1.8v-13h2.4v15c0,2.8 -1.9,4.6 -4,5.2v19.3c0,1 -0.8,1.5 -1.7,1.5s-1.7,-0.5 -1.7,-1.5v-19.3c-2.1,-0.6 -3.4,-2.4 -3.4,-5.2z'/><path fill='white' d='M64.5,34c3.6,1.8 5.5,7 5.5,13.5v7.5h-3v18.5c0,1 -0.8,1.5 -1.75,1.5s-1.75,-0.5 -1.75,-1.5z'/></svg>">
  <link rel="stylesheet" href="style/css/style.css">
  <link rel="stylesheet" href="style/css/font-awesome.min.css">
</head>

<body>

  <div class="app">
    <!-- Barra lateral -->
    <aside class="lateral">
      <div class="marca">
        <span class="selo"><svg class="logo" viewBox="18 18 72 72" aria-hidden="true"><path d="M40,34h2.4v13h1.8v-13h2.4v13h1.8v-13h2.4v15c0,2.8 -1.9,4.6 -4,5.2v19.3c0,1 -0.8,1.5 -1.7,1.5s-1.7,-0.5 -1.7,-1.5v-19.3c-2.1,-0.6 -3.4,-2.4 -3.4,-5.2z"/><path d="M64.5,34c3.6,1.8 5.5,7 5.5,13.5v7.5h-3v18.5c0,1 -0.8,1.5 -1.75,1.5s-1.75,-0.5 -1.75,-1.5z"/></svg></span>
        <div>
          <strong>As Resetas</strong>
          <small>do Pardelo</small>
        </div>
      </div>

      <button class="btn primario ancho" id="nova">+ Nova receita</button>

      <input class="buscar" id="buscar" type="search" placeholder="Buscar por nome ou ingrediente…">

      <div class="filtros" id="filtro-cat">
        <button data-cat="" class="activo">Todas</button>
        <button data-cat="comida">Comidas</button>
        <button data-cat="postre">Postres</button>
      </div>
      <div class="filtro-etiquetas" id="filtro-etiquetas"></div>

      <ul class="lista" id="lista"></ul>
      <p class="baleiro-lista" id="baleiro-lista">Aínda non hai receitas.</p>
    </aside>

    <!-- Editor -->
    <main class="principal">
      <div class="barra">
        <span class="estado" id="estado"></span>
        <div class="accions">
          <button class="btn fantasma" id="eliminar">Eliminar</button>
          <button class="btn" id="exportar">Exportar PDF</button>
        </div>
      </div>

      <article class="folla-editor">
        <header class="cabeceira">
          <div class="cabeceira-texto">
            <textarea id="titulo" class="titulo" rows="1" placeholder="Título da receita"></textarea>

            <div class="categorias" id="categorias">
              <button type="button" data-cat="comida">🍽 Comida</button>
              <button type="button" data-cat="postre"><i class="fa fa-cutlery" aria-hidden="true"></i> Postre</button>
            </div>

            <div class="etiquetas" id="etiquetas">
              <input id="nova-etiqueta" list="todas-etiquetas" placeholder="+ etiqueta (p. ex. salsas)">
              <datalist id="todas-etiquetas"></datalist>
            </div>
          </div>

          <label class="foto" id="foto" title="Fai clic ou arrastra unha imaxe">
            <input type="file" id="ficheiro" accept="image/*" hidden>
            <img id="foto-img" alt="">
            <span class="foto-texto">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="3" y="5" width="18" height="14" rx="2" />
                <circle cx="12" cy="12" r="3.5" />
                <path d="M8 5l1.5-2h5L16 5" />
              </svg>
              Engadir foto
            </span>
            <button type="button" class="quitar-foto" id="quitar-foto" title="Quitar foto">×</button>
          </label>
        </header>

        <section>
          <h2>Ingredientes</h2>
          <ul class="ingredientes" id="ingredientes"></ul>
          <button class="engadir" id="engadir-ingrediente">+ Engadir ingrediente</button>
        </section>

        <div id="bloques"></div>
        <button class="engadir-bloque" id="engadir-bloque">+ Engadir outro bloque de pasos <small>(p. ex. crema,
            recheo…)</small></button>

        <section>
          <h2>Notas</h2>
          <textarea id="notas" class="notas" rows="3"
            placeholder="Trucos, variantes, de onde saíu a receita…"></textarea>
        </section>

        <p class="axuda">Consello: <kbd>Intro</kbd> crea unha liña nova (no ingrediente, salta á cantidade) · <kbd>Shift</kbd>+<kbd>Intro</kbd> salto de
          liña dentro dun paso · pega unha lista e sepárase soa.</p>
      </article>
    </main>
  </div>

  <!-- Versión para imprimir / PDF -->
  <article class="folla-pdf" id="folla-pdf"></article>

  <div class="aviso" id="aviso"></div>

  <!-- Xanela de confirmación -->
  <div class="modal" id="modal" hidden>
    <div class="modal-caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
      <h3 id="modal-titulo"></h3>
      <p id="modal-texto"></p>
      <div class="modal-botons">
        <button class="btn" id="modal-non">Cancelar</button>
        <button class="btn perigo" id="modal-si"></button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
