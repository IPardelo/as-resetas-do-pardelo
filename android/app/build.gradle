plugins {
    id 'com.android.application'
}

android {
    namespace 'es.ipardelo.resetas'
    compileSdk 35

    defaultConfig {
        applicationId 'es.ipardelo.resetas'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // A interface é a mesma carpeta web/ do escritorio: non hai código duplicado.
    // (Inclúe web/config/firebase.json coa configuración de Firebase.)
    sourceSets {
        main {
            assets.srcDirs = ['../../web']
        }
    }
}

dependencies {
    // Aliña as versións de kotlin-stdlib que traen as librarías de androidx (evita "Duplicate class kotlin...")
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
}
